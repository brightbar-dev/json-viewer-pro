# THROWAWAY (steward pass 2026-10-06): prove release.yml's build-and-upload steps on ubuntu-26.04
# before ubuntu-latest migrates (2026-10-19). Never merged. No secrets: an ephemeral CRX key, build-only.
name: u2604-dryrun
on: pull_request
permissions:
  contents: read
  packages: read
jobs:
  build-and-upload-dryrun:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
      - run: cat /etc/os-release | head -3; bash --version | head -1; openssl version; jq --version; curl --version | head -1; gh --version | head -1
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec wxt prepare
      - run: pnpm test
      - run: pnpm exec wxt zip
      - run: pnpm exec wxt zip --browser firefox
      - run: ls -la .output/*.zip
      - name: cws-publish.sh build-only with an ephemeral key
        run: |
          k=$(mktemp); openssl genrsa -out "$k" 2048 2>/dev/null
          openssl rsa -in "$k" -pubout -out /tmp/eph.pub 2>/dev/null
          CWS_CRX_KEY="$(cat "$k")" CWS_CRX_PUBLIC_KEY=/tmp/eph.pub CWS_PUBLISHER_ID=x CWS_ITEM_ID=x CWS_BUILD_ONLY=true bash scripts/cws-publish.sh
