name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx wxt prepare
      - run: npm test

      - name: Build Chrome ZIP
        run: npx wxt zip

      - name: Build Firefox ZIP
        run: npx wxt zip --browser firefox

      - name: Upload ZIPs to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} .output/*.zip

      # Chrome Web Store API v2 (the v1 API stops on 2026-10-15). The logic lives in a script so that
      # tests/cws-publish.test.mjs can run it: the release path is otherwise untested until a release is cut.
      - name: Publish to Chrome Web Store
        env:
          CWS_SA_KEY: ${{ secrets.CWS_SA_KEY }}
          CWS_CRX_KEY: ${{ secrets.CWS_CRX_KEY }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: 11844dd1-bc05-433e-99d0-613f8fd461a2
          CWS_ITEM_ID: iodhhjpjemdfmmfffmejfnbbjbfafoac
          CWS_AUTO_PUBLISH: ${{ vars.CWS_AUTO_PUBLISH }}
        run: bash scripts/cws-publish.sh
