name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commits, tags and GitHub Releases
      pull-requests: write # opens and updates the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
      packages: read # npm ci pulls @brightbar-dev/review-nudge from GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx wxt prepare
      - run: npm test

      - name: Build Chrome ZIP
        run: npx wxt zip

      - name: Build Firefox ZIP
        run: npx wxt zip --browser firefox

      - name: Upload ZIPs to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} .output/*.zip

      # Chrome Web Store API v2 (the v1 API stops on 2026-10-15). The logic lives in a script so that
      # tests/cws-publish.test.mjs can run it: the release path is otherwise untested until a release is cut.
      - name: Publish to Chrome Web Store
        env:
          CWS_SA_KEY: ${{ secrets.CWS_SA_KEY }}
          CWS_CRX_KEY: ${{ secrets.CWS_CRX_KEY }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: 11844dd1-bc05-433e-99d0-613f8fd461a2
          CWS_ITEM_ID: iodhhjpjemdfmmfffmejfnbbjbfafoac
          CWS_AUTO_PUBLISH: ${{ vars.CWS_AUTO_PUBLISH }}
        run: bash scripts/cws-publish.sh
