name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # npm ci pulls @brightbar-dev/review-nudge from GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx wxt prepare
      - run: npm test
      # Typecheck. Added 2026-08-26: `wxt build` bundles with esbuild, which
      # STRIPS types without checking them, so a type error has never been able
      # to fail this workflow. Two real ones (TS2322 on entrypoints/content.ts)
      # had been sitting on main undetected until a merge review ran tsc by hand.
      - run: npx tsc --noEmit
      - name: Build Chrome
        run: npx wxt build
      - name: Build Firefox
        run: npx wxt build --browser firefox
      # The privacy promise, enforced: no network APIs, no remote addresses, no
      # code from strings, and no permission beyond storage, in either build.
      - name: Privacy check
        run: node scripts/check-privacy.mjs .output/chrome-mv3 .output/firefox-mv2
