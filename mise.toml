[tools]
node = "22"
pnpm = "12.6.0"

[tasks.test]
run = "pnpm test"
description = "Run Vitest tests"

[tasks.build]
run = "pnpm exec wxt build"
description = "Production build (Chrome)"

[tasks."build:firefox"]
run = "pnpm exec wxt build --browser firefox"

[tasks.dev]
run = "pnpm exec wxt dev"
description = "Dev mode with HMR (Chrome)"

[tasks.setup]
run = "pnpm install --frozen-lockfile && pnpm exec wxt prepare"
description = "Install deps and prepare WXT"

[tasks.zip]
run = "pnpm exec wxt zip"
description = "Build + zip for store submission"

[tasks.ci]
run = ["pnpm install --frozen-lockfile", "pnpm exec wxt prepare", "pnpm test", "pnpm exec wxt build"]
description = "Full CI pipeline"
